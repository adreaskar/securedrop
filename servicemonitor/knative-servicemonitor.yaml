apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: knative-serving
  namespace: observability
  labels:
    release: kube-prom-stack
spec:
  namespaceSelector:
    matchNames:
      - knative-serving
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - activator
          - autoscaler
          - controller
          - net-kourier
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s