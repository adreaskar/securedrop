apiVersion: apps/v1
kind: Deployment
metadata:
  name: thingsboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thingsboard
  template:
    metadata:
      labels:
        app: thingsboard
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "thingsboard-role"
        vault.hashicorp.com/agent-inject-secret-config.env: "secret/data/securedrop/thingsboard"
        vault.hashicorp.com/agent-inject-template-config.env: |
          {{- with secret "secret/data/securedrop/thingsboard" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end -}}
    spec:
      serviceAccountName: thingsboard-sa
      containers:
        - name: thingsboard
          image: thingsboard/tb-postgres:3.8.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              if [ -f /vault/secrets/config.env ]; then
                . /vault/secrets/config.env
              fi
              exec /usr/bin/start-tb.sh
          ports:
            - containerPort: 9090
            - containerPort: 1883
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /var/log/thingsboard
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: thingsboard-data
        - name: logs
          persistentVolumeClaim:
            claimName: thingsboard-logs