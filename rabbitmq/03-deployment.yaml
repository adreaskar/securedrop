apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "rabbitmq-role"
        vault.hashicorp.com/agent-inject-secret-config.env: "secret/data/securedrop/rabbitmq"
        vault.hashicorp.com/agent-inject-template-config.env: |
          {{- with secret "secret/data/securedrop/rabbitmq" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end -}}
    spec:
      serviceAccountName: rabbitmq-sa
      securityContext:
        fsGroup: 999

      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 999:999 /var/lib/rabbitmq"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq

      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management
          command: ["/bin/bash", "-c"]
          args:
            [". /vault/secrets/config.env && sleep 5 && exec rabbitmq-server"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 5672
            - containerPort: 15672
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 20
            periodSeconds: 10

          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: topology-vol
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
            - name: topology-vol
              mountPath: /etc/rabbitmq/conf.d/10-custom.conf
              subPath: 10-custom.conf
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
        - name: topology-vol
          configMap:
            name: rabbitmq-topology
            defaultMode: 0666
