- name: Install and configure MicroK8s
  hosts: vm1
  become: yes

  vars_files:
    - microk8s_users.yml

  vars:
    traefik_namespace: "traefik"
    traefik_service_name: "traefik"

    microk8s_addons:
      - dns
      - storage
      - hostpath-storage
      - registry
      - cert-manager
      - community
      - helm3
      - traefik
      - observability

  tasks:
    - name: Install snapd
      apt:
        name: snapd
        state: present
        update_cache: yes

    - name: Install MicroK8s
      command: snap install microk8s --classic
      args:
        creates: /snap/bin/microk8s

    - name: Wait for MicroK8s to be ready
      command: microk8s status --wait-ready
      changed_when: false

    - name: Allow incoming traffic on eth0
      ufw:
        rule: allow
        direction: in
        interface: eth0

    - name: Allow outgoing traffic on eth0
      ufw:
        rule: allow
        direction: out
        interface: eth0

    - name: Set UFW default routed policy to allow
      command: ufw default allow routed
      changed_when: false

    - name: Allow HTTP traffic
      ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS traffic
      ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Add users to microk8s group
      user:
        name: "{{ item }}"
        groups: microk8s
        append: yes
      loop: "{{ microk8s_users }}"

    - name: Ensure .kube directory exists for users
      file:
        path: "/home/{{ item }}/.kube"
        state: directory
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0755"
      loop: "{{ microk8s_users }}"

    - name: Generate kubeconfig for users
      shell: microk8s.kubectl config view --raw > /home/{{ item }}/.kube/config
      args:
        executable: /bin/bash
      loop: "{{ microk8s_users }}"

    - name: Fix kubeconfig ownership
      file:
        path: "/home/{{ item }}/.kube/config"
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0600"
      loop: "{{ microk8s_users }}"

    - name: Add kubectl alias to user profile
      lineinfile:
        path: "/home/{{ item }}/.profile"
        line: "alias k='microk8s.kubectl'"
        create: yes
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0644"
      loop: "{{ microk8s_users }}"

    - name: Enable MicroK8s addons
      command: "microk8s enable {{ item }}"
      loop: "{{ microk8s_addons }}"
      register: addon_result
      changed_when: >
        'is already enabled' not in addon_result.stdout and
        'already enabled' not in addon_result.stdout and
        'already enabled' not in addon_result.stderr
      failed_when: >
        addon_result.rc != 0 and
        'is already enabled' not in addon_result.stdout and
        'already enabled' not in addon_result.stdout and
        'already enabled' not in addon_result.stderr

    - name: Wait for Traefik service to exist
      command: "microk8s.kubectl get svc {{ traefik_service_name }} -n {{ traefik_namespace }}"
      register: traefik_svc_check
      retries: 20
      delay: 5
      until: traefik_svc_check.rc == 0
      changed_when: false

    - name: Patch Traefik service external IP
      command: >
        microk8s.kubectl patch svc {{ traefik_service_name }}
        -n {{ traefik_namespace }}
        -p '{"spec":{"externalIPs":["{{ traefik_external_ip }}"]}}'
      register: traefik_patch_result
      changed_when: "'patched' in traefik_patch_result.stdout"

    - name: Add HashiCorp Helm repo
      command: microk8s helm3 repo add hashicorp https://helm.releases.hashicorp.com
      register: hashicorp_repo_result
      changed_when: >
        'has been added' in hashicorp_repo_result.stdout or
        'has been added' in hashicorp_repo_result.stderr
      failed_when: >
        hashicorp_repo_result.rc != 0 and
        'already exists' not in hashicorp_repo_result.stderr

    - name: Update Helm repos
      command: microk8s helm3 repo update
      changed_when: false

    - name: Install Vault Agent Injector
      command: >
        microk8s helm3 upgrade --install vault hashicorp/vault
        --namespace vault
        --create-namespace
        --set server.enabled=false
        --set injector.enabled=true
        --set injector.externalVaultAddr=https://vault.securedrop.gr
      register: vault_injector_result
      changed_when: >
        'deployed' in vault_injector_result.stdout or
        'upgraded' in vault_injector_result.stdout

    - name: Show MicroK8s status
      command: microk8s status
      register: microk8s_status
      changed_when: false

    - name: Show Traefik service
      command: "microk8s.kubectl get svc {{ traefik_service_name }} -n {{ traefik_namespace }} -o wide"
      register: traefik_svc_result
      changed_when: false

    - name: Show observability pods
      command: microk8s.kubectl get pods -n observability
      register: observability_pods_result
      changed_when: false
      failed_when: false

    - name: Print MicroK8s status
      debug:
        var: microk8s_status.stdout_lines

    - name: Print Traefik service
      debug:
        var: traefik_svc_result.stdout_lines

    - name: Print observability pods
      debug:
        var: observability_pods_result.stdout_lines