server {
    listen 8081;
    
    # Root directory where the build output is
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # This handles the SPA routing (like 'serve -s')
        # If a file exists, serve it. If not, fallback to index.html.
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets (JS/CSS) for better performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}