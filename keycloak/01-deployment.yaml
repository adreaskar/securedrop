apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "keycloak-role"
        vault.hashicorp.com/agent-inject-secret-config.env: "secret/data/securedrop/keycloak"
        vault.hashicorp.com/agent-inject-template-config.env: |
          {{- with secret "secret/data/securedrop/keycloak" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end -}}
    spec:
      serviceAccountName: keycloak-sa
      containers:
        - name: keycloak
          image: keycloak/keycloak:24.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              . /vault/secrets/config.env && 
              /opt/keycloak/bin/kc.sh start-dev
          resources:
            requests:
              memory: "1.5Gi"
              cpu: "250m"
            limits:
              memory: "2.5Gi"
              cpu: "1000m"
          ports:
            - containerPort: 8080
              name: http
