apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: securedrop-scanner
  namespace: default
  labels:
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/window: "10s"
        autoscaling.knative.dev/scale-to-zero-pod-retention-period: "30s"

        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "scanner-role"
        vault.hashicorp.com/agent-inject-secret-config.env: "secret/data/securedrop/scanner"
        vault.hashicorp.com/agent-inject-template-config.env: |
          {{- with secret "secret/data/securedrop/scanner" -}}
          {{- range $k, $v := .Data.data }}
          export {{ $k }}="{{ $v }}"
          {{- end }}
          {{- end -}}
    spec:
      serviceAccountName: scanner-sa
      containerConcurrency: 5
      enableServiceLinks: false
      timeoutSeconds: 300
      containers:
        - name: securedrop-scanner
          image: securedropgr/stateless-scanner:109-40abdd8
          command:
            - /bin/sh
            - -c
            - |
              set -e

              if [ -f /vault/secrets/config.env ]; then
                . /vault/secrets/config.env
              fi

              exec node src/index.js
          ports:
            - containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  traffic:
    - latestRevision: true
      percent: 100
