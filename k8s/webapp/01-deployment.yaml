apiVersion: apps/v1
kind: Deployment
metadata:
  name: securedrop-webapp
  labels:
    app: securedrop-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: securedrop-webapp
  template:
    metadata:
      labels:
        app: securedrop-webapp
    spec:
      containers:
        - name: webapp
          image: adreaskar/securedrop-webapp:2.0
          imagePullPolicy: Always
          resources:
            requests:
              memory: "200Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 80
          env:
            - name: VITE_KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: securedrop-secrets
                  key: VITE_KEYCLOAK_URL
            - name: VITE_KEYCLOAK_REALM
              valueFrom:
                secretKeyRef:
                  name: securedrop-secrets
                  key: VITE_KEYCLOAK_REALM
            - name: VITE_KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: securedrop-secrets
                  key: VITE_KEYCLOAK_CLIENT_ID
            - name: VITE_API_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: securedrop-secrets
                  key: VITE_API_BASE_URL
