apiVersion: batch/v1
kind: Job
metadata:
  name: thingsboard-init-job
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-thingsboard
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Waiting for ThingsBoard..."
              until nc -z thingsboard 9090; do
                echo "Sleeping 5s..."
                sleep 5
              done
      containers:
        - name: init-script
          image: python:3.12-slim
          command:
            - sh
            - -c
            - "pip install requests && python /config/init_thingsboard.py"
          env:
            - name: TB_URL
              value: "http://thingsboard:9090"
            - name: TB_ADMIN_USER
              value: "tenant@thingsboard.org"
            - name: TB_ADMIN_PASS
              value: "tenant"
          volumeMounts:
            - name: config-volume
              mountPath: /config
      volumes:
        - name: config-volume
          configMap:
            name: thingsboard-init-config