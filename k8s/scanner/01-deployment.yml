apiVersion: apps/v1
kind: Deployment
metadata:
  name: securedrop-scanner
  labels:
    app: securedrop-scanner
spec:
  replicas: 4
  selector:
    matchLabels:
      app: securedrop-scanner
  template:
    metadata:
      labels:
        app: securedrop-scanner
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "scanner-role"
        vault.hashicorp.com/agent-inject-secret-config.env: "secret/data/securedrop/scanner"
        vault.hashicorp.com/agent-inject-template-config.env: |
          {{- with secret "secret/data/securedrop/scanner" -}}
          export RABBITMQ_DEFAULT_USER="{{ .Data.data.RABBITMQ_DEFAULT_USER }}"
          export RABBITMQ_DEFAULT_PASS="{{ .Data.data.RABBITMQ_DEFAULT_PASS }}"
          export RABBITMQ_URL="amqp://{{ .Data.data.RABBITMQ_DEFAULT_USER }}:{{ .Data.data.RABBITMQ_DEFAULT_PASS }}@rabbitmq:5672/"
          export MINIO_ACCESS_KEY="{{ .Data.data.MINIO_ACCESS_KEY }}"
          export MINIO_SECRET_KEY="{{ .Data.data.MINIO_SECRET_KEY }}"
          export QUEUE_NAME="{{ .Data.data.QUEUE_NAME }}"
          export MINIO_ENDPOINT="{{ .Data.data.MINIO_ENDPOINT }}"
          export MINIO_PORT="{{ .Data.data.MINIO_PORT }}"
          export CLAMAV_HOST="{{ .Data.data.CLAMAV_HOST }}"
          export CLAMAV_PORT="{{ .Data.data.CLAMAV_PORT }}"
          export SOURCE_BUCKET="{{ .Data.data.SOURCE_BUCKET }}"
          export APPROVED_BUCKET="{{ .Data.data.APPROVED_BUCKET }}"
          export REJECTED_BUCKET="{{ .Data.data.REJECTED_BUCKET }}"
          export API_BASE_URL="{{ .Data.data.API_BASE_URL }}"
          {{- end -}}
    spec:
      serviceAccountName: scanner-sa
      containers:
        - name: securedrop-scanner
          image: securedropgr/securedrop-scanner:1.0.0 
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args: ["source /vault/secrets/config.env && node src/index.js"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
                