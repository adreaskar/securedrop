apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clamav-monitor
  namespace: observability
  labels:
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      app: clamav # Ψάχνει το Service με label app: clamav
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: metrics 
      interval: 30s
      path: /metrics
