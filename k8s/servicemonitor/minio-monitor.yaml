apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio-monitor
  namespace: observability
  labels:
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      app: minio # <--- Ταιριάζει με το Label που βάλαμε στο Βήμα 2
  namespaceSelector:
    matchNames:
      - default # <--- Το namespace που τρέχει το MinIO
  endpoints:
    - port: api # <--- Στοχεύουμε την πόρτα 9000 (που ονομάσαμε 'api')
      interval: 30s
      path: /minio/v2/metrics/cluster
      scheme: http
